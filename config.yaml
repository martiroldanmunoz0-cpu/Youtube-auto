# Configuración del canal. Cambia lo que quieras y haz commit: el sistema lo lee en cada ejecución.

canal:
  nombre: "The Curio Lab"                 # canal en inglés para EE. UU. (antes: Curiosidario, en español)
  handle: "@thecuriolabfac"                # tu @ de YouTube (vacío = no se muestra)
  idioma: "en"                             # en = todo en inglés (guiones, voz, textos, títulos); es = español
  tarjeta_final:
    titulo: "Follow"
    subtitulo: "for more mind-blowing facts"
    mostrar: false   # false = sin tarjeta final ni despedida: el vídeo acaba en la última frase y enlaza con el principio (bucle)
    locucion: ""     # despedida hablada al final ("" = sin voz)

analisis:
  regiones: ["US", "GB", "CA", "AU"]         # países cuyo "Tendencias" se mira
  dias: 7                                    # ventana de análisis
  duracion_max_seg: 180                      # solo Shorts
  # Búsquedas para encontrar las curiosidades que más funcionan. Se combinan con lo más visto de cada país.
  busquedas:
    - "what if"
    - "fun facts"
    - "did you know"
    - "weird facts"
    - "things you didn't know"
    - "mind blowing facts"
    - "science facts"
    - "space facts"
    - "human body facts"
    - "history facts"
    - "explained in 60 seconds"
    - "true story"
  top_videos: 60                             # cuántos vídeos se pasan a la IA

generacion:
  largos_por_semana: 2           # la tanda de los lunes son VÍDEOS LARGOS (cada plano con su escena a medida). Los Shorts, solo por pedido
  videos_por_semana: 8           # (antiguo: Shorts por semana; ya no se usa en la tanda semanal)
  no_repetir_ultimos: 150        # no repite ningún tema de los últimos 150 vídeos generados
  # Análisis de tendencias e ideas (1 petición/semana): el modelo más listo, decide la estrategia y los ganchos.
  modelo_analisis: "claude-opus-5-5"
  # Escritura de cada guion: más barato. Si quieres guiones aún más trabajados, pon "claude-opus-5-5" (cuesta el doble).
  modelo_guiones: "claude-sonnet-5-5"
  usar_lotes: true               # lote de Claude (Batch API): -50% de coste, tarda unos minutos más
  esfuerzo_guiones: "medium"     # cuánto "piensa" el guionista: low | medium | high (high = mejor pero más caro)
  duracion_objetivo_seg: [28, 38]   # ~30 s: más % visto y más repeticiones
  duracion_caso_real_seg: [32, 42]    # historias reales: algo más de margen
  duracion_largo_seg: [480, 600]       # vídeos largos (horizontal): 8-10 minutos
  mezcla: "auto"                 # auto = la IA decide según tendencias (historias, datos, casos reales...)
  # Lo que más te gusta (se tiene en cuenta en ideas y guiones). Edítalo cuando quieras.
  estilo_preferido: >-
    Narración inmersiva y cercana (a menudo en segunda persona: el espectador VIVE la situación), con escalada de
    tensión y un giro final que sorprenda. ESTRUCTURAS VARIADAS: no repitas la cuenta por tiempos ("día 1, hora 2,
    segundo 3…"); úsala como mucho en 1 de cada 4 vídeos. Alterna entre: mito contra realidad, misterio que se va
    resolviendo, comparación de escalas (de lo pequeño a lo enorme), "lo que nadie te cuenta", experimento mental,
    ranking o top, historia con protagonista y giro, pregunta que se responde con una sorpresa, antes y después.
    También le gustan las HISTORIAS REALES contadas como un buen documental (protagonista con nombre, qué le pasó,
    giros y un final que pocos conocen).
voz:
  motor: "auto"                  # auto = voz clonada si existe, si no Edge | edge | espeak
  clon: "narrador_en3"           # voz del canal en inglés (diseñada por el dueño con IA, uso comercial permitido) (assets/voices/, VoxCPM2). Vacío = solo Edge
  voz: "en-US-AndrewNeural"      # voz de Edge de respaldo si la clonada falla
  velocidad: "+6%"
  tono: "-2Hz"

musica:
  efectos: true                  # efectos sincronizados con lo que pasa (assets/sfx, CC0) + ambiente del lugar
  efectos_db: 0                  # subir/bajar todos los efectos (dB)
  fondo_musical: false           # música de fondo generada: apagada
  pista_largos: "assets/music/piano_fondo.ogg"   # piano del canal (del dueño) en bucle en los vídeos largos
  volumen_largos_lufs: -34       # música MUY baja (se oye poquito, la voz se entiende perfecta); además baja sola cuando habla la voz
  volumen_ambiente: 0.1

publicacion:
  zona_horaria: "America/New_York"   # horas de publicación en hora de Nueva York (público de EE. UU.)
  # Listas de reproducción temáticas: cada Short se añade a la suya al subirlo (más tiempo de sesión en el canal).
  listas: ["Human Body", "What If...?", "Incredible True Stories", "Space & Planet Earth", "Myths vs Facts", "Animals & Nature", "Weird Science"]
  # Horas de publicación (hora de Nueva York) según cuántos vídeos salen ese día. Picos de EE. UU.: mediodía y tarde-noche.
  # Pensadas para España + Latinoamérica: se publica 1-2 h ANTES de los picos de audiencia para que YouTube
  # tenga tiempo de empezar a mostrarlo. Entre semana: comida (14-15 h) y tarde-noche (19-23 h, en Latinoamérica
  # es mediodía-tarde). Fin de semana: media mañana y tarde. Si un día ya tiene un vídeo, los nuevos se separan
  # al menos 2 horas de él.
  horas:
    laborable:                     # lunes a viernes
      1: ["18:00"]
      2: ["12:00", "19:00"]
      3: ["11:30", "15:30", "19:30"]
    fin_de_semana:                 # sábado y domingo
      1: ["11:00"]
      2: ["10:30", "17:00"]
      3: ["10:00", "14:00", "18:30"]
  max_por_dia: 2                 # como máximo 2 shorts al día (+ 1 vídeo largo al día aparte)
  margen_minutos: 45             # se puede programar para HOY si la hora queda al menos 45 min por delante
  categoria_id: "24"             # 24 = Entretenimiento
  # true = el sistema sube y programa los vídeos. false = no los sube y te deja en el issue todo listo para subirlos a mano
  # (úsalo solo si YouTube bloqueara como privados los vídeos subidos por la API).
  subir_por_api: true

# Sketches de comedia (botón "Comedia GTA")
comedia:
  tema: "situaciones graciosas que pasan jugando a GTA 6 con tus amigos"
  ambiente: "ciudad tropical de neones al atardecer, playas, palmeras, coches deportivos y policía (estilo GTA 6, diseño propio)"
  variante: "España"              # cómo hablan los personajes
  palabrotas: "muchas"            # ninguna | moderadas | muchas
  videos: 3
  busquedas: ["GTA 6", "GTA VI", "GTA 6 memes", "GTA 6 amigos", "GTA online con amigos", "momentos graciosos GTA"]
  narrador: "narrador"
  voces:                          # clon = voz de assets/voices/; voz/velocidad/tono = respaldo de Edge
    narrador:     { clon: "narrador_en3",   voz: "en-US-AndrewNeural",  velocidad: "+8%",  tono: "+0Hz" }
    chico_1:      { clon: "chico_chulito",  voz: "es-ES-AlvaroNeural",  velocidad: "+14%", tono: "+10Hz" }
    chico_2:      { clon: "chico_nervioso", voz: "es-GQ-JavierNeural",  velocidad: "+10%", tono: "+0Hz" }
    chico_grave:  { clon: "chico_grave",    voz: "es-ES-AlvaroNeural",  velocidad: "+2%",  tono: "-14Hz" }
    chico_latino: { voz: "es-MX-JorgeNeural",   velocidad: "+10%", tono: "+0Hz" }
    chica_1:      { clon: "chica",          voz: "es-ES-ElviraNeural",  velocidad: "+10%", tono: "+0Hz" }
    chica_2:      { voz: "es-ES-ElviraNeural",  velocidad: "+14%", tono: "+12Hz" }
    chica_latina: { voz: "es-MX-DaliaNeural",   velocidad: "+10%", tono: "+0Hz" }

# Miniaturas con IA para los vídeos largos. Claves en los secretos de GitHub: OPENAI_API_KEY (o GEMINI_API_KEY).
miniaturas_ia:
  activo: false                   # false = las portadas de los largos las dibuja Claude con nuestros personajes (export portada()); true = IA
  proveedor: "openai"             # openai | gemini (si falta la clave de uno, usa el otro)
  modelo_openai: "gpt-image-1"    # si este nombre ya no existe, se usa el modelo de imágenes más nuevo
  calidad_openai: "medium"        # low | medium | high (high se ve algo mejor pero cuesta ~4 veces más)
  tamano_openai: "1536x1024"
  modelo: "gemini-2.5-flash-image"   # si este nombre ya no existe, se usa solo el primer modelo de imágenes disponible
  nota_minima: 8        # Claude puntúa cada miniatura; por debajo de 8 se repite una vez con las correcciones
  intentos: 2           # máximo de imágenes por vídeo (~4 céntimos cada una)
  nota_descartar: 5     # si ninguna llega a 5, se usa la miniatura de siempre (fotograma del vídeo)
