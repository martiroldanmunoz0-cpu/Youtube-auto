# Configuración del canal. Cambia lo que quieras y haz commit: el sistema lo lee en cada ejecución.

canal:
  nombre: "Curiosidario"                  # nombre que aparece en la tarjeta final
  handle: "@curiosdiario"                  # tu @ de YouTube (vacío = no se muestra)
  idioma: "es"
  tarjeta_final:
    titulo: "Sígueme"
    subtitulo: "para más curiosidades"
    locucion: "Sígueme para más curiosidades. Curiosidario."   # lo dice el narrador al final ("" = sin voz)

analisis:
  regiones: ["ES", "MX", "AR", "CO", "US"]   # países cuyo "Tendencias" se mira
  dias: 7                                    # ventana de análisis
  duracion_max_seg: 180                      # solo Shorts
  # Búsquedas para encontrar las curiosidades que más funcionan. Se combinan con lo más visto de cada país.
  busquedas:
    - "datos curiosos"
    - "sabías que"
    - "qué pasaría si"
    - "curiosidades"
    - "cosas que no sabías"
    - "datos increíbles"
    - "ciencia curiosa"
    - "curiosidades del espacio"
    - "curiosidades del cuerpo humano"
    - "historia curiosa"
    - "explicado en 1 minuto"
    - "datos que te volarán la cabeza"
  top_videos: 60                             # cuántos vídeos se pasan a la IA

generacion:
  videos_por_semana: 8           # se generan más de 7 para que puedas descartar alguno
  no_repetir_ultimos: 150        # no repite ningún tema de los últimos 150 vídeos generados
  # Análisis de tendencias e ideas (1 petición/semana): el modelo más listo, decide la estrategia y los ganchos.
  modelo_analisis: "claude-opus-5-5"
  # Escritura de cada guion: más barato. Si quieres guiones aún más trabajados, pon "claude-opus-5-5" (cuesta el doble).
  modelo_guiones: "claude-sonnet-5-5"
  usar_lotes: true               # lote de Claude (Batch API): -50% de coste, tarda unos minutos más
  duracion_objetivo_seg: [45, 75]
  mezcla: "auto"                 # auto = la IA decide según tendencias (historias, datos, casos reales...)
  # Lo que más te gusta (se tiene en cuenta en ideas y guiones). Edítalo cuando quieras.
  estilo_preferido: >-
    Narración inmersiva en segunda persona: el espectador VIVE la situación ("Te despiertas y...", "Esta noche,
    en tu cama..."). Progresión paso a paso o día a día (día 1, día 2, día 3... o cada vez más grande), con
    escalada de tensión y un giro final que sorprenda. Formatos que funcionan: "cada noche/cada día pasa algo
    más", falso telediario o diario que avanza, "imagina que...". Los rankings o listas de cifras solo como
    recurso puntual dentro de una historia, no como vídeo entero.

voz:
  motor: "auto"                  # auto = voz clonada si existe, si no Edge | edge | espeak
  clon: "narrador"               # voz clonada de assets/voices/ (VoxCPM2). Vacío = solo Edge
  voz: "es-ES-AlvaroNeural"      # voz de Edge de respaldo si la clonada falla
  velocidad: "+6%"
  tono: "-2Hz"

musica:
  volumen_ambiente: 0.16         # pad oscuro generado + efectos de transición
  efectos: true

publicacion:
  zona_horaria: "Europe/Madrid"
  # Horas de publicación (hora de España) según cuántos vídeos salen ese día.
  # Pensadas para España + Latinoamérica: se publica 1-2 h ANTES de los picos de audiencia para que YouTube
  # tenga tiempo de empezar a mostrarlo. Entre semana: comida (14-15 h) y tarde-noche (19-23 h, en Latinoamérica
  # es mediodía-tarde). Fin de semana: media mañana y tarde. Si un día ya tiene un vídeo, los nuevos se separan
  # al menos 2 horas de él.
  horas:
    laborable:                     # lunes a viernes
      1: ["19:00"]
      2: ["14:00", "20:30"]
      3: ["13:30", "18:00", "21:30"]
    fin_de_semana:                 # sábado y domingo
      1: ["12:00"]
      2: ["12:00", "19:30"]
      3: ["11:00", "16:30", "20:30"]
  max_por_dia: 3                 # nunca más de 3 vídeos el mismo día
  dias_horizonte: 7              # se intenta repartir lo pendiente en los próximos 7 días
  categoria_id: "24"             # 24 = Entretenimiento
  # true = el sistema sube y programa los vídeos. false = no los sube y te deja en el issue todo listo para subirlos a mano
  # (úsalo solo si YouTube bloqueara como privados los vídeos subidos por la API).
  subir_por_api: true

# Sketches de comedia (botón "Comedia GTA")
comedia:
  tema: "situaciones graciosas que pasan jugando a GTA 6 con tus amigos"
  ambiente: "ciudad tropical de neones al atardecer, playas, palmeras, coches deportivos y policía (estilo GTA 6, diseño propio)"
  variante: "España"              # cómo hablan los personajes
  palabrotas: "muchas"            # ninguna | moderadas | muchas
  videos: 3
  busquedas: ["GTA 6", "GTA VI", "GTA 6 memes", "GTA 6 amigos", "GTA online con amigos", "momentos graciosos GTA"]
  narrador: "narrador"
  voces:                          # clon = voz de assets/voices/; voz/velocidad/tono = respaldo de Edge
    narrador:     { clon: "narrador",       voz: "es-ES-AlvaroNeural",  velocidad: "+8%",  tono: "-2Hz" }
    chico_1:      { clon: "chico_chulito",  voz: "es-ES-AlvaroNeural",  velocidad: "+14%", tono: "+10Hz" }
    chico_2:      { clon: "chico_nervioso", voz: "es-GQ-JavierNeural",  velocidad: "+10%", tono: "+0Hz" }
    chico_grave:  { clon: "chico_grave",    voz: "es-ES-AlvaroNeural",  velocidad: "+2%",  tono: "-14Hz" }
    chico_latino: { voz: "es-MX-JorgeNeural",   velocidad: "+10%", tono: "+0Hz" }
    chica_1:      { clon: "chica",          voz: "es-ES-ElviraNeural",  velocidad: "+10%", tono: "+0Hz" }
    chica_2:      { voz: "es-ES-ElviraNeural",  velocidad: "+14%", tono: "+12Hz" }
    chica_latina: { voz: "es-MX-DaliaNeural",   velocidad: "+10%", tono: "+0Hz" }
