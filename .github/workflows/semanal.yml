name: Generar vídeos de la semana

# Cada lunes a las 4:00 (España) se escriben los guiones de los VÍDEOS LARGOS de la semana (los Shorts ahora son solo
# pedidos especiales). Cada guion queda esperando a que Claude dibuje TODAS sus escenas a medida (una distinta por plano);
# después Claude lanza su montaje. Cuántos por semana: generacion.largos_por_semana en config.yaml.
on:
  schedule:
    - cron: "1 2,3 * * 1"   # lunes 02:01 y 03:01 UTC: solo sigue la que son las 04:01 en Madrid (invierno/verano)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.h.outputs.seguir }}
    steps:
      - id: h
        name: ¿Son las 4:00 en España? (si no, esta ejecución no hace nada)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MY_RUN: ${{ github.run_id }}
          EVENTO: ${{ github.event_name }}
        run: |
          H=$(TZ=Europe/Madrid date +%-H)
          SEGUIR=true
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$H" != "4" ]; then
              SEGUIR=false; echo "En Madrid son las $H h: la tanda arranca en la otra ejecución programada"
            else
              # Por si GitHub retrasó mucho la otra ejecución: nunca dos tandas automáticas el mismo día
              DESDE=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
              for R in $(gh api "repos/$GH_REPO/actions/workflows/semanal.yml/runs?event=schedule&created=>=$DESDE" --jq ".workflow_runs[] | select(.id != $MY_RUN) | .id"); do
                if gh api "repos/$GH_REPO/actions/runs/$R/jobs" --jq '.jobs[] | select(.name == "plan") | .conclusion' | grep -qv skipped; then
                  SEGUIR=false; echo "Ya hay otra tanda automática de hoy ($R)"
                fi
              done
            fi
          fi
          echo "seguir=$SEGUIR" >> "$GITHUB_OUTPUT"

  plan:
    needs: hora
    if: needs.hora.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escribir los guiones de los vídeos largos de la semana (tema elegido por la IA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(python3 -c "import yaml;print((yaml.safe_load(open('config.yaml')).get('generacion') or {}).get('largos_por_semana', 2))")
          echo "Vídeos largos esta semana: $N"
          for i in $(seq 1 "$N"); do gh workflow run largo.yml -f a_medida=true; sleep 20; done
