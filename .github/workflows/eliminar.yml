name: Eliminar vídeo
run-name: "Eliminar ${{ inputs.id }}"

# Lo lanza el calendario del panel (botón «Eliminar») para un vídeo que aún no se ha publicado.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Vídeo (p. ej. historia-1-01)"
        required: true
        type: string
      aunque_publico:
        description: "Borrarlo aunque ya sea público (para sustituirlo por una versión rehecha)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Varios borrados a la vez chocaban al guardar la cola: van de uno en uno.
concurrency:
  group: eliminar
  cancel-in-progress: false

jobs:
  eliminar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Eliminar de YouTube y de la cola
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ID: ${{ inputs.id }}
        run: python pipeline/eliminar.py --id "$ID" $([ "${{ inputs.aunque_publico }}" = "true" ] && echo --aunque_publico)
      - name: Guardar cola
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git config merge.cola.driver "python3 pipeline/fusionar_cola.py %O %A %B"
          git add data/queue.json data/eliminados.json
          git commit -m "Vídeo eliminado: ${{ inputs.id }}" || echo "sin cambios"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; echo "reintento $i"; sleep $((i * 7)); done
          [ "$ok" = 1 ] || { echo "::error::No se pudo guardar la cola"; exit 1; }
