name: Historia real
run-name: "Historia real: ${{ inputs.tema || 'la mejor que encuentre' }}"

# Busca la historia real con más potencial de visualizaciones (que no se haya contado antes) y la cuenta.
# Fases: turno en la cola -> guiones (1 máquina) -> montaje en paralelo (5 máquinas).
# Cada máquina, al terminar su vídeo, lo publica para revisión con su propio issue.
on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (opcional). Vacío = la IA busca la mejor historia que encuentre"
        required: false
        type: string
      cantidad:
        description: "¿Cuántas historias distintas?"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4", "5"]

env:
  TQDM_DISABLE: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  RUN_ID: historia-${{ github.run_number }}
  FORMATO: historia_real
  PEDIDO: ${{ inputs.tema }}
  PEDIDO_N: ${{ inputs.cantidad }}

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

# Cola propia: cada tanda espera a que terminen las lanzadas antes (sin límite de tandas en espera).

jobs:
  turno:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Esperar mi turno en la cola
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MY_RUN: ${{ github.run_id }}
          MY_WF: ${{ github.workflow_ref }}
        run: |
          # La tanda semanal espera a todo lo lanzado antes (así no repite temas de pedidos en curso).
          # Pedidos, historias y rehacer solo esperan a la tanda semanal: entre ellos se montan a la vez.
          SEMANAL='.path == ".github/workflows/semanal.yml" or .path == ".github/workflows/semanal_montar.yml"'
          TODOS="$SEMANAL"' or .path == ".github/workflows/pedido.yml" or .path == ".github/workflows/historia.yml" or .path == ".github/workflows/rehacer.yml"'
          case "$MY_WF" in *semanal*) FILTRO="$TODOS" ;; *) FILTRO="$SEMANAL" ;; esac
          while true; do
            ANTES=$(gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '[.workflow_runs[]
              | select('"$FILTRO"')
              | select(.status != "completed" and .id < ('"$MY_RUN"'))] | length')
            if [ "$ANTES" = "0" ]; then echo "¡Es mi turno!"; break; fi
            echo "Hay $ANTES tanda(s) antes que yo en la cola. Espero 1 minuto..."
            sleep 60
          done

  guiones:
    needs: turno
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      rid: ${{ steps.rid.outputs.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Identificador de la tanda
        id: rid
        run: echo "rid=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Ver qué historias reales están funcionando en YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TRENDS_QUERIES: "historia real|la increíble historia de|caso real increíble|historia real impactante|no sabías esta historia|la historia de este hombre|la historia de esta mujer|true story"
          TRENDS_SIN_REGIONES: "1"
        run: python pipeline/trends.py || echo "Sin análisis de tendencias, la IA elige igualmente"

      - name: Escribir guiones con IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/scripts.py

      - name: Guardar el gasto de API (para el saldo del panel)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git config merge.cola.driver "python3 pipeline/fusionar_cola.py %O %A %B"
          git add data/gasto 2>/dev/null || exit 0
          git commit -m "Gasto de API: $RUN_ID" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done

      - name: Escenas a medida — guardar el guion y esperar a Claude
        if: env.A_MEDIDA == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git config merge.cola.driver "python3 pipeline/fusionar_cola.py %O %A %B"
          python pipeline/medida.py guardar
          git add data/guiones
          git commit -m "Guiones a la espera de escenas a medida: $RUN_ID" || echo "sin cambios"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done

      - name: Marcar el plan semanal como en montaje (así el respaldo no lo lanza dos veces)
        if: env.FASE == 'guiones'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git config merge.cola.driver "python3 pipeline/fusionar_cola.py %O %A %B"
          git add data/planes data/gasto 2>/dev/null || git add data/planes
          git commit -m "Plan $RUN_ID: montando" || echo "sin cambios"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done

      - uses: actions/upload-artifact@v4
        with:
          name: guiones
          path: out
          retention-days: 3

  montar:
    needs: guiones
    if: ${{ inputs.a_medida != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4]
    env:
      RUN_ID: ${{ needs.guiones.outputs.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Instalar herramientas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng
          pip install -r requirements.txt
          npm ci --prefix renderer

      - name: Instalar voces clonadas (VoxCPM2 + Whisper, CPU)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voz.txt

      - name: Caché de modelos de voz (5 GB, solo se descarga la primera vez)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modelos-voz-voxcpm2-whisper-small-v1

      - uses: actions/download-artifact@v4
        with:
          name: guiones
          path: out

      - name: Montar mis vídeos y publicar cada uno para revisión en cuanto está listo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git config merge.cola.driver "python3 pipeline/fusionar_cola.py %O %A %B"
          python pipeline/build.py --parte ${{ matrix.parte }} --partes 5 --revisar

  aviso:
    needs: [turno, guiones, montar]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avisar al móvil si algo ha fallado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create aviso --color D73A4A --description "Algo ha fallado" --force || true
          printf '🔔 @%s ha fallado **%s** (o alguna de sus partes).\n\n👉 [Ver qué ha pasado](%s)\n\nLos vídeos de las partes que sí terminaron ya tienen su issue de revisión. Queda en la pestaña **Problemas** del panel con el registro del error: dile a Claude «revisa los problemas».\n' "$OWNER" "$WF" "$RUN_URL" > aviso.md
          URL=$(gh issue create --title "⚠️ Ha fallado: $WF" --label aviso --body-file aviso.md)
          python3 pipeline/problemas.py run "${{ github.run_id }}" "${URL##*/}"
