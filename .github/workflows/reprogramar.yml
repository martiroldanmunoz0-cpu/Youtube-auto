name: Reprogramar vídeo
run-name: "Reprogramar ${{ inputs.id }} → ${{ inputs.fecha }} ${{ inputs.hora }}"

# Lo lanza el calendario del panel al cambiar el día/hora de un vídeo programado.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Vídeo (p. ej. historia-1-01)"
        required: true
        type: string
      fecha:
        description: "Nuevo día (AAAA-MM-DD, hora de España)"
        required: true
        type: string
      hora:
        description: "Nueva hora (HH:MM, hora de España)"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  reprogramar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cambiar la fecha en YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ID: ${{ inputs.id }}
          FECHA: ${{ inputs.fecha }}
          HORA: ${{ inputs.hora }}
        run: python pipeline/reprogramar.py --id "$ID" --fecha "$FECHA" --hora "$HORA"
      - name: Guardar cola
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git config merge.cola.driver "python3 pipeline/fusionar_cola.py %O %A %B"
          git add data/queue.json
          git commit -m "Vídeo reprogramado: ${{ inputs.id }}" || echo "sin cambios"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; git rebase --abort 2>/dev/null || true; echo "reintento $i"; sleep $((i * 7)); done
