name: Shorts del vídeo largo
run-name: "Shorts recortados de ${{ inputs.id }}"

# Recorta 3 Shorts verticales de un vídeo largo ya montado (la voz y la animación ya están hechas: casi gratis)
# y los manda a Revisar. Se lanza solo al terminar cada montaje largo; también a mano con el id.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Id del vídeo largo (p. ej. largo-29-01)"
        required: true
        type: string
      cuantos:
        description: "Cuántos Shorts sacar (vacío = los de config.yaml)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  recortes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Instalar herramientas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt
          npm ci --prefix renderer
      - name: Recortar los Shorts y mandarlos a Revisar
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_ID: cortos-${{ inputs.id }}
          CUANTOS: ${{ inputs.cuantos }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git config merge.cola.driver "python3 pipeline/fusionar_cola.py %O %A %B"
          python pipeline/recortes.py "${{ inputs.id }}"
      - name: Guardar el gasto de API
        if: always()
        run: |
          git add data/gasto 2>/dev/null || exit 0
          git commit -m "Gasto de API: recortes ${{ inputs.id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i * 7)); done

  aviso:
    needs: [recortes]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avisar si algo ha fallado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create aviso --color D73A4A --description "Algo ha fallado" --force || true
          printf '🔔 @%s ha fallado **Shorts del vídeo largo**.\n\n👉 [Ver qué ha pasado](%s)\n\nDile a Claude «revisa los problemas».\n' "$OWNER" "$RUN_URL" > aviso.md
          URL=$(gh issue create --title "⚠️ Ha fallado: Shorts del vídeo largo" --label aviso --body-file aviso.md)
          python3 pipeline/problemas.py run "${{ github.run_id }}" "${URL##*/}"
