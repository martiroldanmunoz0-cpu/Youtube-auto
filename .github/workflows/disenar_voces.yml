name: Diseñar voces

# Crea voces de narrador nuevas (diseñadas desde una descripción, no clonadas de nadie) y las deja en la publicación "prueba".
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voz.txt
      - name: Caché de modelos de voz
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modelos-voz-voxcpm2-whisper-small-v1
      - run: python pipeline/disenar_voces.py out/voces
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prueba >/dev/null 2>&1 || gh release create prueba --title "Pruebas" --notes "Vídeos y voces de prueba (no se publican)" --prerelease
          gh release upload prueba out/voces/* --clobber
