name: Prueba de miniatura
run-name: "Prueba de miniatura: ${{ inputs.texto }}"

# Genera UNA miniatura con IA (Gemini) para ver el estilo antes de usarlo en los vídeos. La deja en data/miniaturas_prueba/.
on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título del vídeo"
        required: true
        type: string
      idea:
        description: "De qué va el vídeo (una frase)"
        required: true
        type: string
      texto:
        description: "Texto grande de la miniatura (2-4 palabras)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  miniatura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: |
          pip install -r requirements.txt
          npm ci --prefix renderer
      - name: Generar y revisar la miniatura
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TITULO: ${{ inputs.titulo }}
          IDEA: ${{ inputs.idea }}
          TEXTO: ${{ inputs.texto }}
        run: python pipeline/miniatura_ia.py "$TITULO" "$IDEA" "$TEXTO"
      - name: Guardarla en el repositorio
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/miniaturas_prueba || true
          git commit -m "Prueba de miniatura: ${{ inputs.texto }}" || echo "sin cambios"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i * 7)); done
