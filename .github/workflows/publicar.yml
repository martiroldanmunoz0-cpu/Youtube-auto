name: Programar vídeos aprobados

on:
  issues:
    types: [closed]           # al cerrar el issue de revisión
  schedule:
    - cron: "43 7 * * *"      # cada día: termina subidas pendientes si se agotó la cuota
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'revision')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Subir y programar en YouTube
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python pipeline/publish.py --issue ${{ github.event.issue.number }}
          else
            python pipeline/publish.py
          fi

      - name: Guardar cola
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git pull --rebase
          git add -A data || true
          git commit -m "Cola de publicación actualizada" || echo "sin cambios"
          git push

      - name: Avisar al móvil si algo ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create aviso --color D73A4A --description "Algo ha fallado" --force || true
          printf '🔔 @%s ha fallado **%s**.\n\n👉 [Ver qué ha pasado](%s)\n\nMándale una captura del paso en rojo a Claude para arreglarlo. Cuando esté resuelto, cierra este issue.\n' "$OWNER" "$WF" "$RUN_URL" > aviso.md
          gh issue create --title "⚠️ Ha fallado: $WF" --label aviso --body-file aviso.md
