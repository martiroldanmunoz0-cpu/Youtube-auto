name: Programar vídeos aprobados

on:
  issues:
    types: [closed]           # al cerrar el issue de revisión
  schedule:
    - cron: "43 7 * * *"      # cada día: termina subidas pendientes si se agotó la cuota
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: read

# Sin "concurrency": GitHub solo deja una ejecución en espera y cancelaría las demás aprobaciones.
# En su lugar, cada ejecución espera su turno (abajo) y se procesan todas, en orden.

jobs:
  publicar:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'revision')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Esperar mi turno (si cierras varios issues seguidos se procesan todos, en orden)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MY_RUN: ${{ github.run_id }}
        run: |
          while true; do
            ANTES=$(gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '[.workflow_runs[]
              | select(.name == "Programar vídeos aprobados")
              | select(.status != "completed" and .id < ('"$MY_RUN"'))] | length')
            if [ "$ANTES" = "0" ]; then echo "¡Es mi turno!"; break; fi
            echo "Hay $ANTES programación(es) antes que yo. Espero 20 segundos..."
            sleep 20
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Subir y programar en YouTube
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python pipeline/publish.py --issue ${{ github.event.issue.number }}
          else
            python pipeline/publish.py
          fi

      - name: Guardar cola
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add -A data || true
          git commit -m "Cola de publicación actualizada" || echo "sin cambios"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; echo "reintento $i"; sleep $((i * 7)); done

      - name: Avisar al móvil si algo ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create aviso --color D73A4A --description "Algo ha fallado" --force || true
          printf '🔔 @%s ha fallado **%s**.\n\n👉 [Ver qué ha pasado](%s)\n\nMándale una captura del paso en rojo a Claude para arreglarlo. Cuando esté resuelto, cierra este issue.\n' "$OWNER" "$WF" "$RUN_URL" > aviso.md
          gh issue create --title "⚠️ Ha fallado: $WF" --label aviso --body-file aviso.md
