name: Prueba (vídeo de ejemplo)

# Monta un vídeo de curiosidades de ejemplo con la voz del narrador, sin tocar YouTube ni gastar IA.
# Útil para comprobar que todo funciona. El vídeo queda en "Artifacts" de la ejecución.
on:
  workflow_dispatch: {}

env:
  TQDM_DISABLE: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng
          pip install -r requirements.txt
          npm ci --prefix renderer

      - name: Instalar voces clonadas (VoxCPM2 + Whisper, CPU)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voz.txt

      - name: Caché de modelos de voz (5 GB, solo se descarga la primera vez)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modelos-voz-voxcpm2-whisper-small-v1

      - run: python pipeline/build.py --story examples/demo_curiosidad.json --out out/prueba
      - uses: actions/upload-artifact@v4
        with:
          name: video-prueba
          path: out/prueba/*.mp4
